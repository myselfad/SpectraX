training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.0001
  mixed_precision: true
  num_workers: 4
  checkpoint_dir: "./checkpoints"
  save_every_n_epochs: 10

model:
  architecture: "swinir_m"
  in_channels: 4
  out_channels: 4
  scale_factor: 4

data:
  train_dir: "./data/pairs/train"
  val_dir: "./data/pairs/val"
  patch_size: 64

loss:
  pixel_weight: 1.0
  spectral_weight: 0.1
  perceptual_weight: 0.0
